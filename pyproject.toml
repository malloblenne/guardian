[tool.poetry]
name = "guardian"
version = "0.1.0"
description = "A tribute to The Guardian Legend NES game"
authors = ["Mauro Brenna <malloblenne@gmail.com>"]
readme = "README.md"
license = "LGPL-3.0-or-later"
repository = "https://github.com/malloblenne/guardian"
keywords = ["game", "pygame", "guardian-legend", "nes", "tribute"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Arcade",
]

[tool.poetry.scripts]
guardian = "guardian:main"

[tool.poetry.dependencies]
python = "^3.8"
pygame = "^2.6.1"
pytmx = "^3.32"
pyscroll = "^2.31"
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]
black = "<24"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
